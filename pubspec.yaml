name: card_scanner
description: Scan business cards into contacts with the logo as the contact photo.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.1
  flutter_contacts: ^1.1.9+2
  image_cropper: ^8.0.2
flutter:
  uses-material-design: true
